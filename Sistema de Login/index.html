<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG Bank | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #380808; 
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.98);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-effect w-full max-w-md p-10 rounded-[2rem] shadow-2xl transition-transform duration-300">
        
        <div class="text-center mb-10">
            <div class="bg-red-800 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <i class="fas fa-university text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">
                IG <span class="text-red-800">Bank</span>
            </h1>
            <p class="text-gray-400 mt-2 font-medium">Acesse sua conta bancária com segurança</p>
        </div>
        
        <div id="feedback" class="hidden mb-4 p-4 rounded-xl text-sm font-semibold"></div>

        <form id="loginForm" class="space-y-6">

            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-700 ml-1">Email</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                        <i class="fas fa-id-card"></i>
                    </span>
                    <input id="usuario" type="text" placeholder="Digite seu Email" 
                        class="w-full pl-11 pr-4 py-4 bg-gray-50 border border-gray-100 rounded-2xl
                        focus:ring-2 focus:ring-red-600 focus:bg-white outline-none transition-all" required>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-700 ml-1">Senha Numérica</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                        <i class="fas fa-key"></i>
                    </span>
                    <input id="senha" type="password" maxlength="6" placeholder="••••••" 
                        class="w-full pl-11 pr-4 py-4 bg-gray-50 border border-gray-100 rounded-2xl
                        focus:ring-2 focus:ring-red-600 focus:bg-white outline-none transition-all" required>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-red-800 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-red-600 active:scale-[0.98] transition-all text-lg mt-4">
                Entrar no IG Bank
            </button>
        </form>

        <div class="mt-10 flex flex-col items-center space-y-4">
            <div class="flex items-center space-x-2 text-xs text-slate-400 uppercase tracking-widest font-bold">
                <i class="fas fa-lock"></i>
                <span>Ambiente Criptografado e Seguro</span>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const feedback = document.getElementById("feedback");

        // credenciais simuladas 
        const usuarioValido = "igor@igbank.com";
        const senhaValida = "123456";

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value.trim();

            // Regras para Email
            const ehEmail = usuario.includes("@");

            // Validação
            if (!ehEmail) {
                mostrarFeedback("Por favor, insira um email válido.", "bg-red-200 text-red-700");
                return;
            }

            if (senha.length < 6 || isNaN(senha)) {
                mostrarFeedback("A senha deve conter 6 números.", "bg-red-200 text-red-700");
                return;
            }

            // Verifica credenciais
            if (usuario === usuarioValido && senha === senhaValida) {
                mostrarFeedback("Login realizado com sucesso! 🎉", "bg-green-200 text-green-700");

                // animação de sucesso
                setTimeout(() => {
                    feedback.classList.add("scale-110");
                }, 100);
            } else {
                mostrarFeedback("Usuário ou senha incorretos.", "bg-red-200 text-red-700");
            }
        });

        function mostrarFeedback(msg, estilo) {
            feedback.textContent = msg;
            feedback.className = `mb-4 p-4 rounded-xl text-sm font-semibold ${estilo}`;
        }
    </script>

</body>
</html>
